{{- $title := .Get "title" -}}
{{- $url := .Get "url" | relURL -}}
{{- $icon := .Get "icon" | default "fa-calendar-days" -}}
<div class="col-12 col-md-6 col-xl-4 d-flex">
  <a class="card h-100 w-100 border-0 shadow-sm text-decoration-none text-body" href="{{ $url }}">
    <div class="card-body p-4">
      <div class="fs-2 text-primary mb-3" aria-hidden="true">
        <i class="fas {{ $icon }}"></i>
      </div>
      <h3 class="h4 card-title">{{ $title }}</h3>
      <div class="card-text text-secondary">{{ .Inner | markdownify }}</div>
    </div>
    <div class="card-footer border-0 bg-transparent px-4 pb-4 pt-0 text-primary fw-semibold">
      Read the guide <span aria-hidden="true">→</span>
    </div>
  </a>
</div>
